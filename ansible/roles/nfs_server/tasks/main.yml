---
# Runs on the hypervisor (localhost, become root).
- name: Install NFS server
  ansible.builtin.apt:
    name: nfs-kernel-server
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the shared filestore
  ansible.builtin.file:
    path: "{{ filestore_host_path }}"
    state: directory
    owner: "{{ filestore_uid }}"
    group: "{{ filestore_gid }}"
    mode: "0770"

# Fence markers live here. The directory must be writable by the Odoo uid
# because NFS root_squash maps root to nobody (see ADR-007).
- name: Create the fence-marker directory
  ansible.builtin.file:
    path: "{{ filestore_host_path }}/.fence"
    state: directory
    owner: "{{ filestore_uid }}"
    group: "{{ filestore_gid }}"
    mode: "0770"

- name: Export the filestore to the ERP nodes
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: "0644"
  notify: Reload NFS exports

- name: Enable and start the NFS server
  ansible.builtin.service:
    name: nfs-kernel-server
    state: started
    enabled: true

- name: Apply export table now
  ansible.builtin.command: exportfs -ra
  changed_when: false

- name: Read host firewall state
  ansible.builtin.command: ufw status
  register: host_ufw
  changed_when: false
  failed_when: false

- name: Allow NFS from the ERP nodes (host firewall, only if ufw is active)
  community.general.ufw:
    rule: allow
    port: "2049"
    proto: tcp
    from_ip: "{{ item }}"
    comment: "NFS filestore for {{ item }}"
  loop: "{{ nfs_clients }}"
  when: "'Status: active' in (host_ufw.stdout | default(''))"

- name: Show the effective exports
  ansible.builtin.command: exportfs -v
  register: exports_state
  changed_when: false

- name: Exports
  ansible.builtin.debug:
    msg: "{{ exports_state.stdout_lines }}"
