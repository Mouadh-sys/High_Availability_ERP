all:
  vars:
    ansible_user: debian
    ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/ha_erp_ed25519"
    ansible_python_interpreter: /usr/bin/python3

  children:
    hypervisor:
      hosts:
        localhost:
          ansible_connection: local
          ansible_become_password: "{{ vault_become_password }}"

    lb:
      hosts:
        lb01:
          ansible_host: 192.168.50.11
          keepalived_priority: 150
        lb02:
          ansible_host: 192.168.50.12
          keepalived_priority: 100

    erp:
      hosts:
        erp01:
          ansible_host: 192.168.50.21
          db_role: primary
        erp02:
          ansible_host: 192.168.50.22
          db_role: standby
